<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cape Town Interactive Photo Gallery</title>
	
	<!-- Embedded CSS combining assignment rules with accessibility enhancements -->
	<style>
		body {
			margin: 2%;
			border: 1px solid black;
			background-color: #b3b3b3;
			font-family: Arial, sans-serif;
			padding: 20px;
			box-sizing: border-box;
		}

		h1 {
			text-align: center;
			color: #1a1a1a;
			margin-top: 0;
			margin-bottom: 20px;
		}

		#image {
			line-height: 500px; /* Adjusted line-height for vertical alignment */
			width: 100%;
			max-width: 800px;
			height: 500px;
			border: 5px solid black;
			margin: 0 auto;
			background-color: #8e68ff;
			background-image: url('');
			background-repeat: no-repeat;
			color: #FFFFFF;
			text-align: center;
			background-size: cover;
			background-position: center;
			margin-bottom: 25px;
			font-size: 150%;
			font-weight: bold;
			text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
			border-radius: 8px;
			box-sizing: border-box;
			padding: 0 15px;
			overflow: hidden;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.gallery-container {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 15px;
			max-width: 1000px;
			margin: 0 auto;
		}

		.preview {
			width: 140px;
			height: 100px;
			object-fit: cover;
			border: 5px solid black;
			border-radius: 6px;
			cursor: pointer;
			transition: transform 0.2s ease, border-color 0.2s ease;
		}

		/* Hover & Accessibility Focus Ring Highlights */
		.preview:hover,
		.preview:focus {
			transform: scale(1.08);
			border-color: #f59e0b;
			outline: 4px solid #f59e0b;
			outline-offset: 3px;
		}
	</style>

	<!-- Embedded JavaScript for Gallery Event Handlers -->
	<script>
		/**
		 * Executed when page loads (onload).
		 * Logs status and verifies accessibility attributes for all preview images.
		 */
		function initializeGallery() {
			console.log("Gallery Page Loaded Successfully.");
			
			// Select all preview image elements
			const previewImages = document.querySelectorAll('.preview');
			
			// Loop through images to ensure tabindex is active and log readiness
			for (let i = 0; i < previewImages.length; i++) {
				previewImages[i].setAttribute("tabindex", "0");
				console.log("Initialized landmark image " + (i + 1) + ": " + previewImages[i].alt);
			}
		}

		/**
		 * Triggered on mouseover and focus events.
		 * Updates #image background-image to previewPic source and changes text to alt description.
		 * @param {HTMLImageElement} previewPic - The image element being hovered/focused.
		 */
		function upDate(previewPic) {
			/* 1) Change the url for the background image of the div with id = "image" 
			   to the source file of the preview image */
			const imageDiv = document.getElementById("image");
			imageDiv.style.backgroundImage = "url('" + previewPic.src + "')";

			/* 2) Change the text of the div with id = "image" 
			   to the alt text of the preview image */
			imageDiv.innerText = previewPic.alt;
		}

		/**
		 * Triggered on mouseout and blur events.
		 * Resets #image background-image and restores default instruction text.
		 */
		function unDo() {
			/* 1) Update the url for the background image of the div with id = "image" 
			   back to the original image (empty url) */
			const imageDiv = document.getElementById("image");
			imageDiv.style.backgroundImage = "url('')";

			/* 2) Change the text of the div with id = "image" 
			   back to the original text */
			imageDiv.innerText = "Hover over or focus on an image below to display here.";
		}
	</script>
</head>

<body onload="initializeGallery()">

	<h1>Explore Cape Town Photo Gallery</h1>

	<!-- Main Display Box (Original assignment #image ID) -->
	<div id="image" role="region" aria-live="polite" aria-label="Active Landmark Preview">
		Hover over or focus on an image below to display here.
	</div>

	<!-- Thumbnail Section with Cape Town Images -->
	<div class="gallery-container" role="list" aria-label="Cape Town Landmarks Thumbnails">

		<!-- Image 1: Table Mountain -->
		<img 
			class="preview" 
			alt="Table Mountain overlooking Cape Town city bowl and bay" 
			src="https://images.unsplash.com/photo-1580619305218-8423a7ef79b4?auto=format&fit=crop&w=800&q=80" 
			tabindex="0"
			onmouseover="upDate(this)" 
			onmouseout="unDo()"
			onfocus="upDate(this)"
			onblur="unDo()"
			role="listitem"
		>

		<!-- Image 2: Bo-Kaap -->
		<img 
			class="preview" 
			alt="Colorful historic painted houses in Bo-Kaap neighborhood" 
			src="https://images.unsplash.com/photo-1580619300306-030ec603411b?auto=format&fit=crop&w=800&q=80" 
			tabindex="0"
			onmouseover="upDate(this)" 
			onmouseout="unDo()"
			onfocus="upDate(this)"
			onblur="unDo()"
			role="listitem"
		>

		<!-- Image 3: Boulders Beach -->
		<img 
			class="preview" 
			alt="African penguins resting on white sand at Boulders Beach" 
			src="https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?auto=format&fit=crop&w=800&q=80" 
			tabindex="0"
			onmouseover="upDate(this)" 
			onmouseout="unDo()"
			onfocus="upDate(this)"
			onblur="unDo()"
			role="listitem"
		>

		<!-- Image 4: Camps Bay -->
		<img 
			class="preview" 
			alt="Palm tree lined beach at Camps Bay facing the ocean" 
			src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" 
			tabindex="0"
			onmouseover="upDate(this)" 
			onmouseout="unDo()"
			onfocus="upDate(this)"
			onblur="unDo()"
			role="listitem"
		>

		<!-- Image 5: V&A Waterfront -->
		<img 
			class="preview" 
			alt="Harbour ships docked at V&A Waterfront under sunset sky" 
			src="https://images.unsplash.com/photo-1528164344705-47542687990d?auto=format&fit=crop&w=800&q=80" 
			tabindex="0"
			onmouseover="upDate(this)" 
			onmouseout="unDo()"
			onfocus="upDate(this)"
			onblur="unDo()"
			role="listitem"
		>

		<!-- Image 6: Cape Point -->
		<img 
			class="preview" 
			alt="Dramatic sea cliff rocks and waves at Cape Point" 
			src="https://images.unsplash.com/photo-1547471080-7cc2caa01a7e?auto=format&fit=crop&w=800&q=80" 
			tabindex="0"
			onmouseover="upDate(this)" 
			onmouseout="unDo()"
			onfocus="upDate(this)"
			onblur="unDo()"
			role="listitem"
		>

	</div>

</body>
</html>
