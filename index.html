<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cape Town Photo Gallery</title>
	
	<style>
		body {
			margin: 2%;
			border: 1px solid black;
			background-color: #b3b3b3;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			padding: 20px;
			box-sizing: border-box;
		}

		h1 {
			text-align: center;
			color: #1a1a1a;
			margin-top: 0;
			margin-bottom: 20px;
		}

		/* Main Display Box from Assignment */
		#image {
			line-height: 500px;
			width: 100%;
			max-width: 800px;
			height: 500px;
			border: 5px solid black;
			margin: 0 auto;
			background-color: #8e68ff;
			background-image: url('');
			background-repeat: no-repeat;
			color: #FFFFFF;
			text-align: center;
			background-size: cover;
			background-position: center;
			margin-bottom: 25px;
			font-size: 150%;
			font-weight: bold;
			text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
			border-radius: 8px;
			box-sizing: border-box;
			padding: 0 15px;
			overflow: hidden;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: background-image 0.2s ease-in-out;
		}

		.gallery-container {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 15px;
			max-width: 900px;
			margin: 0 auto;
		}

		/* Preview Thumbnail Styling */
		.preview {
			width: 130px;
			height: 95px;
			object-fit: cover;
			border: 5px solid black;
			border-radius: 6px;
			cursor: pointer;
			transition: transform 0.2s ease, border-color 0.2s ease;
		}

		/* Interactive Focus and Hover Highlights */
		.preview:hover,
		.preview:focus {
			transform: scale(1.1);
			border-color: #ffcc00;
			outline: 4px solid #ffcc00;
			outline-offset: 3px;
		}

		img {
			width: 100%;
		}
	</style>

	<script>

		/**
		 * 1) Called when page finishes loading (onload event).
		 * 2) Uses a for loop to iterate through every preview image.
		 * 3) Dynamically sets tabindex="0" for keyboard navigation.
		 */
		function initializeGallery() {
			console.log("Page loaded successfully: initializeGallery() triggered!");

			// Select all preview image elements
			const images = document.querySelectorAll('.preview');
			console.log("Found " + images.length + " preview images. Starting for loop to add tabindex attributes...");

			// For loop through each image
			for (let i = 0; i < images.length; i++) {
				images[i].setAttribute("tabindex", "0");
				console.log("Added tabindex='0' to image #" + (i + 1) + " (" + images[i].alt + ")");
			}

			console.log("Gallery initialization complete. All images are keyboard accessible!");
		}

		/**
		 * Updates main #image background and text content.
		 * Log message verifies event execution for mouseover / focus.
		 * @param {HTMLImageElement} previewPic
		 */
		function upDate(previewPic) {
			console.log("Event triggered: upDate() for image -> " + previewPic.alt);
			console.log("Image Source URL: " + previewPic.src);

			/* 1) Change background image URL of #image to source of preview image */
			const imageDiv = document.getElementById("image");
			imageDiv.style.backgroundImage = "url('" + previewPic.src + "')";

			/* 2) Change text of #image to alt text of preview image */
			imageDiv.innerText = previewPic.alt;
		}

		/**
		 * Resets main #image background and restores original instruction text.
		 * Log message verifies event execution for mouseout / blur.
		 */
		function unDo() {
			console.log("Event triggered: unDo() -> Resetting background and text.");

			/* 1) Reset background image back to empty */
			const imageDiv = document.getElementById("image");
			imageDiv.style.backgroundImage = "url('')";

			/* 2) Restore original instruction text */
			imageDiv.innerText = "Hover over or focus on an image below to display here.";
		}
	</script>
</head>

<body onload="initializeGallery()">

	<h1>Cape Town Landmarks Gallery</h1>

	<!-- Main Display Canvas -->
	<div id="image" role="region" aria-live="polite" aria-label="Large Image Preview">
		Hover over or focus on an image below to display here.
	</div>

	<!-- Thumbnail Gallery Grid -->
	<div class="gallery-container" role="list" aria-label="Cape Town Thumbnails">

		<!-- Image 1: Table Mountain -->
		<img 
			class="preview" 
			alt="Table Mountain overlooking the vibrant city bowl of Cape Town" 
			src="https://tse2.mm.bing.net/th/id/OIP.9C5wb42JEI9ZrnLRcdE3WAHaE7?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" 
			onmouseover="upDate(this)" 
			onmouseout="unDo()"
			onfocus="upDate(this)"
			onblur="unDo()"
			onerror="this.src='https://placehold.co/300x200/8e68ff/ffffff?text=Table+Mountain'"
			role="listitem"
		>

		<!-- Image 2: Bo-Kaap Houses -->
		<img 
			class="preview" 
			alt="Brightly painted historic houses in the Bo-Kaap neighborhood" 
			src="https://tse4.mm.bing.net/th/id/OIP.jBQEAm6GXA9sNNAbfVywxQHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" 
			onmouseover="upDate(this)" 
			onmouseout="unDo()"
			onfocus="upDate(this)"
			onblur="unDo()"
			onerror="this.src='https://placehold.co/300x200/8e68ff/ffffff?text=Bo-Kaap'"
			role="listitem"
		>

		<!-- Image 3: Boulders Beach Penguins -->
		<img 
			class="preview" 
			alt="African penguins gathering on the sandy shores of Boulders Beach" 
			src="https://tse3.mm.bing.net/th/id/OIP.IHwXkUP9y2g6-AW92wRlfwHaEi?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" 
			onmouseover="upDate(this)" 
			onmouseout="unDo()"
			onfocus="upDate(this)"
			onblur="unDo()"
			onerror="this.src='https://placehold.co/300x200/8e68ff/ffffff?text=Boulders+Beach'"
			role="listitem"
		>

		<!-- Image 4: Muizenberg Beach Huts -->
		<img 
			class="preview" 
			alt="Iconic colorful wooden bathing huts along Muizenberg Beach" 
			src="https://www.capetown.travel/wp-content/uploads/Muizenberg-1-600x300.jpg" 
			onmouseover="upDate(this)" 
			onmouseout="unDo()"
			onfocus="upDate(this)"
			onblur="unDo()"
			onerror="this.src='https://placehold.co/300x200/8e68ff/ffffff?text=Muizenberg+Beach'"
			role="listitem"
		>

		<!-- Image 5: Camps Bay Coastline -->
		<img 
			class="preview" 
			alt="Camps Bay beach coastline with palm trees and turquoise Atlantic waters" 
			src="https://tse4.mm.bing.net/th/id/OIP.TQgWeuny8yMG7gcp2mimuAHaE8?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" 
			onmouseover="upDate(this)" 
			onmouseout="unDo()"
			onfocus="upDate(this)"
			onblur="unDo()"
			onerror="this.src='https://placehold.co/300x200/8e68ff/ffffff?text=Camps+Bay'"
			role="listitem"
		>

		<!-- Image 6: Signal Hill Sunset -->
		<img 
			class="preview" 
			alt="Panoramic view of Cape Town ocean and mountains from Signal Hill at sunset" 
			src="https://www.capetourism.com/wp-content/uploads/2023/03/Signal-Hill-scaled.jpg" 
			onmouseover="upDate(this)" 
			onmouseout="unDo()"
			onfocus="upDate(this)"
			onblur="unDo()"
			onerror="this.src='https://placehold.co/300x200/8e68ff/ffffff?text=Signal+Hill'"
			role="listitem"
		>

	</div>

</body>
</html>
